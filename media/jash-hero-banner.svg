<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="50%" stop-color="#09101d"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="28%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#14e8b5" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="78%" cy="65%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2f8f3"/>
      <stop offset="100%" stop-color="#34f5c5"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="cyberGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.07"/>
    </pattern>
    <style>
      .mono { font-family: 'Ubuntu Mono', 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; r: 5px; }
        50% { opacity: 0.45; r: 7px; }
      }
      .live-dot { animation: pulseDot 2.2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="18" fill="url(#bgGrad)"/>
  <rect width="1280" height="420" rx="18" fill="url(#glowCyan)"/>
  <rect width="1280" height="420" rx="18" fill="url(#glowAmber)"/>
  <rect width="1280" height="420" rx="18" fill="url(#cyberGrid)"/>
  <rect x="1.5" y="1.5" width="1277" height="417" rx="16.5" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-opacity="0.75"/>

  <!-- Top Sovereign Eyebrow Pill -->
  <g transform="translate(64, 38)">
    <rect width="468" height="32" rx="16" fill="#081c24" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.65"/>
    <circle class="live-dot" cx="20" cy="16" r="5" fill="#2dd4bf"/>
    <text x="36" y="21" class="mono" font-size="13" font-weight="700" fill="#5eead4" letter-spacing="1.2">BEYOND SOVEREIGN ECOSYSTEM · RING-3 SHELL &amp; FABRIC</text>
  </g>

  <!-- Right Live Telemetry Terminal Card -->
  <g transform="translate(760, 38)">
    <rect width="456" height="288" rx="14" fill="#060b14" fill-opacity="0.92" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect width="456" height="36" rx="14" fill="#0b1322"/>
    <circle cx="22" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="5.5" fill="#27c93f"/>
    <text x="145" y="23" class="mono" font-size="12.5" font-weight="700" fill="#64748b">jash 0.1α — live telemetry</text>

    <!-- Terminal Lines -->
    <text x="22" y="66" class="mono" font-size="13.5" font-weight="700" fill="#34d399">jash&gt; cmake --b<tspan fill="#475569">uild build --target jash  [TAB]</tspan></text>
    <text x="22" y="94" class="mono" font-size="13" fill="#38bdf8">jash&gt; digest --brief . &amp;&amp; graph stats</text>
    <text x="22" y="116" class="mono" font-size="12.5" fill="#94a3b8">[OK] CAS BLAKE3 hit · 95 AST nodes, 305 edges (0.4ms)</text>

    <text x="22" y="146" class="mono" font-size="13" fill="#38bdf8">jash&gt; rm prod.json &amp;&amp; rewind auto</text>
    <text x="22" y="168" class="mono" font-size="12.5" fill="#fbbf24">[OK] Time-Travel restored prod.json (SHA-256 match)</text>

    <text x="22" y="198" class="mono" font-size="13" fill="#38bdf8">jash&gt; sigil chain verify &amp;&amp; sigil proof dsse</text>
    <text x="22" y="220" class="mono" font-size="12.5" fill="#34d399">[OK] BLAKE3 ratchet intact · Ed25519 DSSE signed</text>

    <text x="22" y="250" class="mono" font-size="13" fill="#38bdf8">jash&gt; osif check</text>
    <rect x="18" y="259" width="420" height="22" rx="5" fill="#06281e"/>
    <text x="26" y="274" class="mono" font-size="12.5" font-weight="700" fill="#34d399">[OK] Tier A · 8/8 caps (+SYSID +PROC +MEM +MOUNTS...)</text>
  </g>

  <!-- Main JASH Title & Tagline (Left) -->
  <text x="64" y="164" class="sans" font-size="96" font-weight="800" fill="url(#titleGrad)" letter-spacing="6">J A S H</text>
  <text x="478" y="158" class="mono" font-size="22" font-weight="700" fill="#2dd4bf">0.1α Subsumption</text>

  <text x="64" y="210" class="sans" font-size="26" font-weight="700" fill="#f8fafc">
    The First AI-Native, Time-Traveling &amp; Cryptographically Verifiable Shell.
  </text>
  <text x="64" y="244" class="sans" font-size="17.5" fill="#94a3b8">
    100% Pure C11 · Smart Ghost-Text UX · 171 In-Process JSON Builtins · Living AST Graph · OSIF 2.0
  </text>

  <!-- Feature Pills Row -->
  <g transform="translate(64, 272)">
    <g transform="translate(0, 0)">
      <rect width="142" height="34" rx="8" fill="#0b192c" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="16" y="22" class="mono" font-size="13.5" font-weight="700" fill="#7dd3fc">⚡ Pure C11</text>
    </g>
    <g transform="translate(154, 0)">
      <rect width="178" height="34" rx="8" fill="#0b192c" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5"/>
      <text x="16" y="22" class="mono" font-size="13.5" font-weight="700" fill="#5eead4">⏪ Time-Travel Undo</text>
    </g>
    <g transform="translate(344, 0)">
      <rect width="184" height="34" rx="8" fill="#0b192c" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.5"/>
      <text x="16" y="22" class="mono" font-size="13.5" font-weight="700" fill="#fcd34d">🔐 Ed25519 + BLAKE3</text>
    </g>
    <g transform="translate(540, 0)">
      <rect width="144" height="34" rx="8" fill="#0b192c" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="16" y="22" class="mono" font-size="13.5" font-weight="700" fill="#d8b4fe">🧬 171 Builtins</text>
    </g>
  </g>

  <!-- Bottom Jash Signature Statusbar -->
  <g transform="translate(32, 352)">
    <rect width="1216" height="44" rx="10" fill="#07111e" stroke="#14b8a6" stroke-width="1.2" stroke-opacity="0.45"/>
    <circle class="live-dot" cx="26" cy="22" r="5.5" fill="#34d399"/>
    <text x="44" y="27" class="mono" font-size="14" font-weight="700" fill="#e2e8f0">
      JASH EXOCORTEX  <tspan fill="#334155">|</tspan>  <tspan fill="#5eead4">SIGIL: SEALED (Ed25519/DSSE)</tspan>  <tspan fill="#334155">|</tspan>  <tspan fill="#38bdf8">OSIF: 8 KERNELS</tspan>  <tspan fill="#334155">|</tspan>  <tspan fill="#fcd34d">SUITE: 281/281 GATES</tspan>  <tspan fill="#334155">|</tspan>  <tspan fill="#94a3b8">F E R M I ∞ H A R T · SPL-1.0</tspan>
    </text>
  </g>
</svg>
